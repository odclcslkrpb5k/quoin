# Quoin configuration: ~/.config/quoin/quoin.conf
#
# Strict: an unknown section or key, or a bad value, rejects the whole file (the
# built-in defaults are used and every problem is reported). This example is loaded
# by the test suite, so it always matches what the program accepts.
#
# Commands are split into arguments like a shell would, but no shell ever runs them.
# Placeholders:
#   %d  current directory          %f  one file (runs once per selected file)
#   %F  all selected files         %c  the command to run (TerminalRun only)
#   %%  a literal %
# Files are always passed as absolute paths.

[General]
# F4: open a terminal in the current directory.
Terminal=xfce4-terminal --working-directory=%d
# Run a script (or "Execute in Terminal") so its output stays visible.
TerminalRun=xfce4-terminal --hold --working-directory=%d -x %c
ShowHidden=false
# The window title: the folder's full path (true) or only its name (false).
FullPathInTitle=true
# name | modified | size
SortBy=name

# Extensions that are scripts, and the interpreter used when the file isn't executable.
# If present, this section replaces the built-in list entirely.
[Interpreters]
sh=sh
bash=bash
py=python3
pl=perl
rb=ruby

# Extra or overriding extension -> MIME type mappings (beat the system database).
[Types]
tar.zst=application/x-zstd-compressed-tar

# Right-click menu actions. Types: MIME types, "type/*", or "*". Directories=true also
# offers the action on folders. Placeholders: %f one file (run once per file), %F all of
# them, %d the folder.
# RemoteCommand (optional): what runs instead for files on another machine, there, in
# that folder. Nothing can show a window there, so make it a command-line program; if it
# fails, Quoin shows the end of what it printed. Actions without one aren't offered for
# files on other machines.
[Action extract-here]
Name=Extract Here
Types=application/zip;application/x-compressed-tar;application/x-xz-compressed-tar;application/x-zstd-compressed-tar;application/x-7z-compressed;application/vnd.rar;
Command=file-roller --extract-here %F
# bsdtar (Debian/Ubuntu: libarchive-tools) unpacks every one of these types.
RemoteCommand=bsdtar -xf %f

[Action extract-to]
Name=Extract To…
Types=application/zip;application/x-compressed-tar;application/x-xz-compressed-tar;application/x-zstd-compressed-tar;application/x-7z-compressed;application/vnd.rar;
Command=file-roller --extract %F

[Action compress]
Name=Compress…
Types=*
Directories=true
Command=file-roller --add %F
